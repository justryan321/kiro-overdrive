name: Publish site to gh-pages

# Manual only: this GHE has no Actions runners yet. Normal deploys use `npm run deploy` (see README).
# To deploy automatically once a runner exists, add a push trigger on main for app/**, pack/**, tools/**.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    # Replace with your GHE runner label if ubuntu-latest is not available.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # Needs Node 20+ on the runner. No setup-node, to avoid third-party/unsynced actions on GHE.
      - name: Check Node version
        run: node --version

      - name: Syntax check
        run: npm run check

      - name: Verify pack text is synced into the app
        run: npm run sync:check

      - name: Build static site
        run: npm run build

      - name: Push dist to gh-pages
        env:
          TOKEN: ${{ github.token }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
          SHA: ${{ github.sha }}
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${SHA}"
          git push --force "https://x-access-token:${TOKEN}@${REPO_URL#https://}" gh-pages:gh-pages
